name: VeriLoop regression tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-api.txt
      - run: python -m compileall -q app.py api_server.py pages veriloop tests
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build React frontend
        run: cd web && npm install --no-audit --no-fund && npm run build
      - name: Probe public deployment health (informational only)
        if: ${{ success() }}
        run: python scripts/smoke_deployment.py
